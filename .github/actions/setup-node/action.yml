---
name: Setup Node

description: Install Node.js, restore the npm cache, run `npm ci`, and generate the Prisma client.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "24"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci --include=dev

    - name: Generate Prisma client
      shell: bash
      run: npx prisma generate
