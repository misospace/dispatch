---
name: Setup Node

description: Install Node.js, restore the npm cache, run `npm ci`, and generate the Prisma client.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: "24"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci --include=dev

    - name: Generate Prisma client
      shell: bash
      run: npx prisma generate
