---
name: Setup Node

description: Install Node.js, restore the npm cache, run `npm ci`, and generate the Prisma client.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci --include=dev

    - name: Generate Prisma client
      shell: bash
      run: npx prisma generate
