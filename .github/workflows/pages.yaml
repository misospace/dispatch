name: Site — validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yaml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The site tree carried no audit gate of its own: the install below
      # passes --no-audit and the app-level audit gate only reads the root
      # lockfile, so a vulnerable site dependency could reach the published
      # Pages site unnoticed (#1566). The same command the Security Audit
      # workflow runs against site/ runs here, so this pipeline refuses to
      # build a tree with a known high-severity advisory. It is kept
      # separate from that workflow on purpose: this one is scoped to
      # site/** paths, so it also covers pull requests that target a branch
      # other than main, which the Security Audit workflow does not run for.
      - name: npm audit (site/ dependency tree)
        run: npm audit --include=dev --audit-level=high --fetch-retries=5 --fetch-timeout=120000 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        working-directory: site
      - name: Install and production-build site/
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: site
  build:
    # The publish depends on the validation: without this, a red audit (or a
    # broken site install) would only turn the workflow red while the build
    # and the publish still went out with the previously deployed artifact —
    # which is exactly the path a vulnerable site dependency would take
    # (#1566).
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6
        with:
          path: site
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
