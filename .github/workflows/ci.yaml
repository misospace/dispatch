---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://test:test@localhost:5432/dispatch_ci"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Run lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Run tests
        run: npm run test

  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dispatch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dispatch_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Deploy migrations against an empty database
        run: npm run db:deploy
      - name: Verify current-lane indexes
        run: npx prisma db execute --file scripts/verify-current-lane-indexes.sql
      - name: Create production compatibility database
        run: echo 'CREATE DATABASE dispatch_production;' | npx prisma db execute --stdin
      - name: Verify production migration compatibility
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/dispatch_production"
        run: |
          npx prisma db execute --file scripts/seed-applied-current-lane-migration.sql
          npm run db:deploy
          npx prisma db execute --file scripts/verify-current-lane-indexes.sql

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dispatch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dispatch_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Apply the schema
        run: npm run db:deploy
      # The mocked suite cannot fail for the reason production did: a mock can
      # reject with a P2002-shaped error, but only a real PostgreSQL aborts the
      # surrounding transaction, and that abort is what broke #843 (P2039,
      # #850). Two fixes to this lock shipped green against mocks and failed in
      # the cluster, so this job is the guard rather than a nicety.
      - name: Sync-lock concurrency against a real PostgreSQL
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx vitest run src/lib/sync-lock.integration.test.ts

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Run coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Run build
        run: npm run build
