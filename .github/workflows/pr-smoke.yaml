---
name: PR Smoke

# Stands the app up for real and checks things a unit test cannot see. 0.5.41
# shipped three regressions with CI green: a CSP that blocked the page's own
# inline theme script, a sync lock that wedged, and a groomer that 500s. All
# three needed a running app.
#
# Runs on the self-hosted misospace pool in the test cluster, deploys into a
# throwaway namespace, and deletes it afterwards. Nothing persists.

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: pr-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    # Fork PRs get no secrets and cannot pull the PR image, so skip rather than
    # fail confusingly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: misospace-test
    timeout-minutes: 20
    env:
      NS: dispatch-pr-${{ github.event.pull_request.number }}
      IMAGE: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create namespace
        run: kubectl create namespace "$NS"

      - name: Deploy Postgres
        run: |
          kubectl apply -n "$NS" -f deploy/ci/postgres.yaml
          kubectl rollout status -n "$NS" deploy/postgres --timeout=180s

      - name: Deploy dispatch
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" deploy/ci/dispatch.yaml \
            | kubectl apply -n "$NS" -f -
          kubectl rollout status -n "$NS" deploy/dispatch --timeout=300s

      - name: Inline scripts survive the CSP
        run: node scripts/smoke-csp.mjs "http://dispatch.${NS}:3000"

      - name: Sync does not fail on a wedged lock
        run: |
          # A throwaway token means GitHub calls fail, which is fine. What must
          # not happen is a P2002 on SyncLock: that is the #840 class, where the
          # lock row survives a crash and every later run 500s forever.
          code=$(kubectl run smoke-sync-$RANDOM -n "$NS" --rm -i --restart=Never \
            --image=curlimages/curl:latest --quiet -- \
            -s -o /tmp/body -w '%{http_code}' -X POST \
            "http://dispatch.${NS}:3000/api/sync" || true)
          echo "POST /api/sync -> ${code}"
          if kubectl logs -n "$NS" deploy/dispatch --tail=200 | grep -q "SyncLock"; then
            echo "FAIL: SyncLock error in the app log after a single sync attempt"
            kubectl logs -n "$NS" deploy/dispatch --tail=200 | grep -B2 -A6 "SyncLock"
            exit 1
          fi
          echo "OK  no SyncLock contention on a first run"

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl get all -n "$NS" || true
          kubectl logs -n "$NS" deploy/dispatch --tail=200 || true
          kubectl describe pods -n "$NS" || true

      - name: Tear down
        if: always()
        run: kubectl delete namespace "$NS" --wait=false || true
