---
name: PR Smoke

# Stands the app up for real and checks things a unit test cannot see. 0.5.41
# shipped three regressions with CI green: a CSP that blocked the page's own
# inline theme script, a sync lock that wedged, and a groomer that 500s. All
# three needed a running app.
#
# Runs on the self-hosted misospace pool in the test cluster. The runner has no
# cluster-wide permissions and cannot create namespaces, so every PR shares the
# misospace-ci namespace and is separated by instance name. See
# joryirving/home-ops#9383 for why it is scoped that way.

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: pr-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    # Fork PRs get no registry credentials and cannot pull the PR image, so skip
    # rather than fail confusingly. This is a convenience, NOT a security
    # control: a fork controls its own workflow file and can remove this line.
    # The real boundary is the runner's namespaced RBAC.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: misospace-test
    timeout-minutes: 20
    env:
      NS: misospace-ci
      INSTANCE: pr${{ github.event.pull_request.number }}
      IMAGE: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Point kubectl at this cluster
        run: |
          # The runner pod carries a projected ServiceAccount token, but kubectl
          # does not use in-cluster credentials on its own the way a controller
          # does, so build a kubeconfig from what is mounted.
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster in-cluster \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
            --certificate-authority="$SA/ca.crt" --embed-certs=true
          kubectl config set-credentials runner --token="$(cat $SA/token)"
          kubectl config set-context in-cluster \
            --cluster=in-cluster --user=runner --namespace="$NS"
          kubectl config use-context in-cluster
          # Fail here with a clear message rather than three steps later.
          kubectl auth can-i create deployments -n "$NS"

      - name: Clear any leftovers from a previous run
        run: |
          kubectl delete deploy,svc,pod -n "$NS" \
            -l "smoke-instance=${INSTANCE}" --ignore-not-found --wait=true

      - name: Deploy Postgres
        run: |
          sed "s|INSTANCE|${INSTANCE}|g" deploy/ci/postgres.yaml \
            | kubectl apply -n "$NS" -f -
          kubectl rollout status -n "$NS" "deploy/postgres-${INSTANCE}" --timeout=180s

      - name: Deploy dispatch
        run: |
          sed -e "s|IMAGE_PLACEHOLDER|${IMAGE}|" -e "s|INSTANCE|${INSTANCE}|g" \
            deploy/ci/dispatch.yaml | kubectl apply -n "$NS" -f -
          kubectl rollout status -n "$NS" "deploy/dispatch-${INSTANCE}" --timeout=300s

      - name: Inline scripts survive the CSP
        run: node scripts/smoke-csp.mjs "http://dispatch-${INSTANCE}.${NS}:3000"

      - name: Sync does not wedge on a stale lock
        run: |
          # The GitHub token here is fake, so the sync call is expected to fail
          # on auth. What must not appear is a P2002 on SyncLock: that is the
          # #840 class, where the lock row outlives its holder and every later
          # run 500s forever. Asserting "not this failure" rather than success
          # is what lets this run without real credentials.
          code=$(kubectl run "smoke-sync-${INSTANCE}-$RANDOM" -n "$NS" --rm -i \
            --restart=Never --image=curlimages/curl:latest --quiet -- \
            -s -o /dev/null -w '%{http_code}' -X POST \
            "http://dispatch-${INSTANCE}.${NS}:3000/api/sync" || true)
          echo "POST /api/sync -> ${code}"
          if kubectl logs -n "$NS" "deploy/dispatch-${INSTANCE}" --tail=300 | grep -q "SyncLock"; then
            echo "FAIL: SyncLock error after a single sync attempt"
            kubectl logs -n "$NS" "deploy/dispatch-${INSTANCE}" --tail=300 | grep -B2 -A6 "SyncLock"
            exit 1
          fi
          echo "OK  no SyncLock contention on a first run"

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get all -n "$NS" -l "smoke-instance=${INSTANCE}" || true
          kubectl logs -n "$NS" "deploy/dispatch-${INSTANCE}" --tail=200 || true
          kubectl describe pods -n "$NS" -l "smoke-instance=${INSTANCE}" || true

      - name: Tear down this instance
        if: always()
        run: |
          kubectl delete deploy,svc,pod -n "$NS" \
            -l "smoke-instance=${INSTANCE}" --ignore-not-found --wait=false || true
